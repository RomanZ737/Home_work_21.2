exclude = 'venv'


[tool.black]
line-length = 119
exclude = ''' ( /(\.git) ) '''

[tool.isort]
line_length = 119
[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=1.20.2,<2.0.0)"
]
